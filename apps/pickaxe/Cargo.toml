[package]
name = "pickaxe"
description = "Pickaxe: find out how any software works, then craft your own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
pickaxe-engine = { workspace = true }
pickaxe-platform = { workspace = true }
pickaxe-ai = { workspace = true }
pickaxe-setup = { workspace = true }
pickaxe-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }
# The one dialog the app shows itself: when its window can't open, so a start that shows nothing
# still says why (#166).
rfd = { workspace = true }

[features]
wasm-plugins = ["pickaxe-engine/wasm-plugins"]

[build-dependencies]
# Icon + VERSIONINFO for pickaxe.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
