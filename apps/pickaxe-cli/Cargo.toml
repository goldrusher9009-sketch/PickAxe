[package]
name = "pickaxe-cli"
description = "Pickaxe on the command line: every tool, the MCP server, setup and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pickaxe-engine = { workspace = true }
pickaxe-engines = { workspace = true }
pickaxe-evidence = { workspace = true }
pickaxe-platform = { workspace = true }
pickaxe-mcp = { workspace = true }
pickaxe-ai = { workspace = true }
pickaxe-setup = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
wasm-plugins = ["pickaxe-engine/wasm-plugins"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# The DPI-aware manifest for pickaxe-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
