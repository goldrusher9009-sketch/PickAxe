[package]
name = "pickaxe-ai"
description = "AI backends, the agent loop and crews for Pickaxe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
pickaxe-evidence = { workspace = true }
pickaxe-engine = { workspace = true }
pickaxe-engines = { workspace = true }
pickaxe-formats = { workspace = true }
pickaxe-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
ureq = "3"
# Pictures are sent to models as base64 (the same version the engine crate uses).
base64 = "0.22"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
pickaxe-testkit = { workspace = true }
